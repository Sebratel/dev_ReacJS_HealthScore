server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Quem pode abrir o Health Score num quadro (iframe): só ele mesmo e o Hub
    # Apps (produção e staging). Sem X-Frame-Options de propósito — ele não
    # sabe listar origens e, com DENY/SAMEORIGIN, o Hub não conseguiria embutir.
    #
    # ATENÇÃO à herança do nginx: um `location` que declara QUALQUER add_header
    # deixa de herdar os do server. Por isso a linha é repetida em todo
    # location abaixo que tem add_header próprio. Não mover isto para o
    # "Advanced" do Nginx Proxy Manager: lá ele some num redeploy da stack.
    add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;

    # Compressão para texto (NÃO inclui octet-stream → o snapshot .data fica intacto)
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome (ex.: /assets/index-AbC123.js) → cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;
        try_files $uri =404;
    }

    # Snapshot de dados: já é gzip (descomprimido no cliente). Serve cru, sem
    # transformar, e sempre revalida — assim a atualização diária aparece na hora.
    location = /realClients.data {
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;
        try_files $uri =404;
    }

    # index.html nunca em cache → o navegador sempre pega o build mais novo.
    # É AQUI que cai toda rota da SPA (try_files do `location /` redireciona
    # internamente para /index.html), então é este o cabeçalho que o Hub vê.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;
    }

    # Backend de queries — proxy para o serviço `api` da stack (porta 8787).
    # Repassa a URI completa (/api/...), então as rotas do backend batem direto.
    location /api/ {
        # Configs das engines (índices dinâmicos sobre a base completa) podem
        # gerar corpos grandes no POST /api/dashboard e /api/engine.
        client_max_body_size 12m;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
