# Health Score Sebratel — stack de produção (SPA estática via nginx + API de queries).
# Deploy no Portainer: Stacks → Add stack → Repository → branch main.
# Defina VITE_GOOGLE_CLIENT_ID (e, se quiser, QUERY_EDITOR_EMAILS) nas
# "Environment variables" da stack. Para abrir dentro do Hub Apps:
# HUB_SSO_SECRET + HUB_APP_ID (e HUB_ONLY=true para fechar o acesso direto).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client ID público do Google OAuth (variável de build do Vite).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: healthyscore-web:latest
    # Imagem construída localmente (não existe em registry) → sempre buildar,
    # nunca puxar. Evita o 'pull access denied' no redeploy do Portainer.
    pull_policy: build
    container_name: healthyscore-web
    restart: unless-stopped
    networks:
      - churniq
    # Só entra no ar depois que o backend responde ao healthcheck — assim o
    # proxy /api/ do nginx nunca sobe apontando para uma API ainda indisponível.
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Porta do host (esquerda) configurável; 80 é a porta interna do nginx.
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1, não localhost: no alpine o localhost resolve para ::1 e o nginx
      # só escuta IPv4 — o container ficava "unhealthy" com o site no ar.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend de queries — serve/edita o catálogo de queries do ETL. O nginx do
  # `web` faz proxy de /api/ para cá. Os overrides ficam no volume `appdata`,
  # compartilhado com a máquina/job que roda o ETL (fetch-clients.mjs).
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: churniq-api:latest
    pull_policy: build
    container_name: churniq-api
    restart: unless-stopped
    networks:
      - churniq
    environment:
      API_PORT: 8787
      # Domínio de e-mail permitido para acessar (todos @domínio = viewer).
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # ── Controle de acesso (RBAC) ──
      # Admins SEMENTE (CSV) — sempre admin, não removíveis pela tela. Garante
      # que sempre haja alguém pra abrir "Usuários e Acessos".
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Power users de bootstrap por env (CSV). Opcional — o resto é gerido na
      # tela, onde cada um recebe os SETORES que pode editar. Quem vem por env
      # tem todos os setores (a semente não é rebaixável).
      POWER_USER_EMAILS: ${POWER_USER_EMAILS:-}
      # Legado: QUERY_EDITOR_EMAILS ainda conta como power_user (compat).
      QUERY_EDITOR_EMAILS: ${QUERY_EDITOR_EMAILS:-}
      # ── Entrada pelo Hub Apps (iframe com login automático) ──
      # HUB_SSO_SECRET = o MESMO valor do SSO_JWT_SECRET do hub-api. Segredo:
      # só na env da stack, nunca em variável VITE_ (iria para o bundle).
      HUB_SSO_SECRET: ${HUB_SSO_SECRET:-}
      # Id do card do Health Score no Hub (tabela apps). SEM padrão de
      # propósito: vazio = entrada pelo Hub desligada e HUB_ONLY ignorado.
      HUB_APP_ID: ${HUB_APP_ID:-}
      # true = só pelo Hub, SEM exceção (nem ADMIN_EMAILS): login pelo Google é
      # recusado no servidor, e sessões do Google já abertas param de valer.
      # Só vale com HUB_SSO_SECRET e HUB_APP_ID preenchidos.
      HUB_ONLY: ${HUB_ONLY:-false}
      # Link do botão "Abrir o Hub Apps" (só https). Padrão: produção.
      HUB_URL: ${HUB_URL:-}
      # Papéis geridos pela tela (volume compartilhado, persiste entre deploys).
      ROLES_PATH: /app/data/roles.json
      # Config oficial (pesos + limiares) — fonte única do scoring, no volume.
      OFFICIAL_CONFIG_PATH: /app/data/official-config.json
      QUERY_OVERRIDES_PATH: /app/data/query-overrides.json
      # Base materializada (snapshot gerado pelo `etl`) que o backend carrega em
      # memória. É daqui que vem TODO o scoring — nenhuma tela consulta banco.
      SNAPSHOT_PATH: /snapshot/realClients.data
      # ── Banco da aplicação (Planos de Ação) ──
      # Único banco em que o sistema escreve. Separado do pool do ETL de
      # propósito. Sem estas variáveis a API sobe e o módulo fica indisponível
      # (a tela explica o que falta) — o resto do sistema não é afetado.
      DB_APP_DATABASE: ${DB_APP_DATABASE:-DB_HealthScore}
      DB_APP_HOST: ${DB_APP_HOST:-}
      DB_APP_PORT: ${DB_APP_PORT:-}
      DB_APP_USER: ${DB_APP_USER:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      # Fallback: mesmo servidor MariaDB do ETL, outra base.
      DB_MARIA_HOST: ${DB_MARIA_HOST:-}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}
      DB_MARIA_USER: ${DB_MARIA_USER:-}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD:-}
      # ── Provedor de IA (Planos de Ação) ──
      # O provedor é cadastrado pela TELA e fica cifrado no volume `appdata`.
      # APP_SECRET é a chave que cifra: sem ela, uma é gerada em data/.secret
      # (funciona, mas aí perder o volume é perder o que foi cifrado) — por isso
      # vale defini-la na stack, para a chave não depender do volume.
      #   openssl rand -base64 48 · trocá-la torna ilegível o que já foi cifrado.
      APP_SECRET: ${APP_SECRET:-}
      # Bootstrap opcional — só vale enquanto nada foi cadastrado na tela.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
    volumes:
      # CAMINHO ABSOLUTO DO HOST — nunca `./data`. Este é o único estado do
      # sistema que não dá para regerar: usuários liberados pela tela, config
      # oficial de scoring, overrides de SQL, provedor de IA e a chave .secret.
      #
      # Era `./data`, bind mount RELATIVO. Como a stack é publicada por
      # Repository, o Portainer recria o diretório do clone a cada redeploy e
      # `data/` está no .gitignore: vinha sem a pasta, o Docker criava uma vazia
      # e montava por cima. Todo redeploy apagava tudo. Só sobrevivia quem
      # estava em ADMIN_EMAILS, que vem da env da stack.
      #
      # Caminho do host (e não volume nomeado) de propósito: fica fora do
      # alcance de `docker volume prune`, `compose down -v` e da remoção da
      # stack no Portainer. O dado vive no servidor, entra no backup normal da
      # máquina e é inspecionável sem entrar no container.
      - ${DATA_DIR:-/opt/healthscore/data}:/app/data
      - snapshot:/snapshot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Job do ETL — gera o snapshot COMPLETO da base 1x por dia de madrugada
  # (fetch-clients.mjs full) e grava no volume `snapshot`, compartilhado com a
  # `api`. Bootstrap: se o volume estiver vazio, roda uma vez ao subir.
  etl:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: churniq-api:latest
    pull_policy: build
    container_name: churniq-etl
    restart: unless-stopped
    networks:
      - churniq
    command: ["node", "scripts/etl-scheduler.mjs"]
    # O ETL é um agendador, sem servidor HTTP: o HEALTHCHECK herdado do
    # Dockerfile.api (GET :8787/api/health) nunca respondia e o deixava sempre
    # "unhealthy". Sem checagem, o estado volta a refletir se o processo roda.
    healthcheck:
      disable: true
    environment:
      SNAPSHOT_OUT: /snapshot/realClients.data
      QUERY_OVERRIDES_PATH: /app/data/query-overrides.json
      # Hora local da execução diária (0-23). Force uma execução ao subir com
      # ETL_RUN_ON_START=true (além do bootstrap quando o volume está vazio).
      ETL_HOUR: ${ETL_HOUR:-3}
      ETL_RUN_ON_START: ${ETL_RUN_ON_START:-}
      # Reavaliação de impacto dos Planos de Ação: roda logo depois do ETL,
      # porque o score "depois" só é novo quando o snapshot é novo.
      # Desligue com ACTION_PLAN_OUTCOMES=off.
      ACTION_PLAN_OUTCOMES: ${ACTION_PLAN_OUTCOMES:-}
      # Assertividade (coorte mensal): roda no dia 1º, por último no ciclo, e
      # publica o indicador do mês que fechou. Grava monthly-cohort.json ao lado
      # do snapshot — é o MESMO /snapshot que a `api` monta (read-only) para ler.
      # Ligada por omissão; as variáveis ficam aqui só para serem visíveis.
      #   MONTHLY_COHORT=off       desliga
      #   MONTHLY_COHORT_DAY=1     dia do mês em que publica
      #   MONTHLY_COHORT_FORCE=true  roda fora do dia marcado (teste)
      MONTHLY_COHORT: ${MONTHLY_COHORT:-}
      MONTHLY_COHORT_DAY: ${MONTHLY_COHORT_DAY:-}
      MONTHLY_COHORT_FORCE: ${MONTHLY_COHORT_FORCE:-}
      SNAPSHOT_PATH: /snapshot/realClients.data
      OFFICIAL_CONFIG_PATH: /app/data/official-config.json
      DB_APP_DATABASE: ${DB_APP_DATABASE:-DB_HealthScore}
      DB_APP_HOST: ${DB_APP_HOST:-}
      DB_APP_PORT: ${DB_APP_PORT:-}
      DB_APP_USER: ${DB_APP_USER:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      # Bancos usados pelo ETL (read-only recomendado). Preencha na stack.
      DB_ELLEVEN_HOST: ${DB_ELLEVEN_HOST:-}
      DB_ELLEVEN_DATABASE: ${DB_ELLEVEN_DATABASE:-}
      DB_ELLEVEN_USER: ${DB_ELLEVEN_USER:-}
      DB_ELLEVEN_PASSWORD: ${DB_ELLEVEN_PASSWORD:-}
      DB_ELLEVEN_PORT: ${DB_ELLEVEN_PORT:-5432}
      DB_ELLEVEN_SSL: ${DB_ELLEVEN_SSL:-}
      DB_MARIA_HOST: ${DB_MARIA_HOST:-}
      DB_MARIA_DATABASE: ${DB_MARIA_DATABASE:-}
      DB_MARIA_USER: ${DB_MARIA_USER:-}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD:-}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}
      # Banco AutoISP (quedas de PPPoE / status da ONU) — opcional: sem as
      # variáveis o ETL roda normalmente, apenas sem o sinal de ONU.
      DB_AUTOISP_HOST: ${DB_AUTOISP_HOST:-}
      DB_AUTOISP_DATABASE: ${DB_AUTOISP_DATABASE:-}
      DB_AUTOISP_USER: ${DB_AUTOISP_USER:-}
      DB_AUTOISP_PASSWORD: ${DB_AUTOISP_PASSWORD:-}
      DB_AUTOISP_PORT: ${DB_AUTOISP_PORT:-5432}
      DB_AUTOISP_SSL: ${DB_AUTOISP_SSL:-}
    volumes:
      # Mesmo caminho da `api` — os dois serviços leem/gravam a mesma config
      # oficial e os mesmos overrides de query. Se mudar DATA_DIR, muda para os
      # dois: são a mesma pasta, e divergir aqui faria o ETL pontuar com uma
      # config e a tela mostrar outra.
      - ${DATA_DIR:-/opt/healthscore/data}:/app/data
      - snapshot:/snapshot

# Rede interna dedicada da stack. O nginx do `web` resolve o backend pelo nome
# do serviço (`api`) dentro dela — é isso que faz o proxy /api/ funcionar.
# Subir a stack inteira (front + backend) é um comando só:
#   docker compose up -d --build
networks:
  churniq:
    driver: bridge

# Volume do snapshot completo: o `etl` grava, a `api` lê (materialização em
# memória). Sobrevive a redeploys — os dados atualizam sozinhos de madrugada.
#
# O que é CONFIGURADO PELA TELA (roles.json, official-config.json,
# query-overrides.json, ia.json, .secret) NÃO fica aqui: mora em DATA_DIR, um
# caminho do host. Volume nomeado sobrevive a redeploy, mas some com
# `volume prune` / `down -v` / remoção da stack — e esse é o único dado do
# sistema que não dá para regerar a partir do banco de origem.
volumes:
  snapshot:
